print(&quot;\\n&quot; + &quot;=&quot;*65)\n    print(&quot;AFFILIATE CONVERSION PIPELINE DIAGNOSTIC REPORT&quot;)\n    print(&quot;=&quot;*65 + &quot;\\n&quot;)\n\n    print(f&quot;- Monthly Search Impressions: {impressions:,}&quot;)\n    print(f&quot;- Monthly Organic Visits:     {visits:,} (Organic CTR: {organic_ctr:.2f}% | Target: 2.0%\u20135.0%)&quot;)\n    print(f&quot;- Outbound Affiliate Clicks:  {outbound_clicks:,} (Affiliate CTR: {affiliate_ctr:.2f}% | Target: 3.0%\u20138.0%)&quot;)\n    print(f&quot;- Completed Merchant Sales:   {sales} (Merchant CR: {merchant_cr:.2f}% | Target: 2.0%\u20134.0%)&quot;)\n    print(f&quot;- Total Recorded Revenue:     ${total_rev:.2f}\\n&quot;)\n\n    print(&quot;### DIAGNOSTIC TRIAGE:&quot;)\n    if impressions &lt; 500:\n        print(&quot;\u274c CRITICAL BOTTLENECK: Low Search Visibility (Bottleneck 1)&quot;)\n        print(&quot;  - Action: Domain is still in sandbox or lacking internal links.&quot;)\n        print(&quot;  - Fix: Check GSC indexation; run scripts/audit_internal_links.py; add unique tables.&quot;)\n    elif organic_ctr &lt; 1.5 and impressions &gt; 1000:\n        print(&quot;\u26a0\ufe0f BOTTLENECK: Poor Search Snippet CTR (Bottleneck 1B)&quot;)\n        print(&quot;  - Action: Titles or meta descriptions are uncompelling.&quot;)\n        print(&quot;  - Fix: Rewrite title tags to include technical parameters, years, and actionable hooks.&quot;)\n    elif affiliate_ctr &lt; 2.0:\n        print(&quot;\u274c CRITICAL BOTTLENECK: Poor On-Page Affiliate Click-Through (Bottleneck 2)&quot;)\n        print(&quot;  - Action: Visitors are reading content but not clicking outbound links.&quot;)\n        print(&quot;  - Fix: Move 'Top Pick' box above the fold; replace 'Buy Now' with 'Check Live Price'; add comparison table.&quot;)\n    elif outbound_clicks &gt;= 100 and sales == 0:\n        print(&quot;\u274c CRITICAL BOTTLENECK: Merchant Conversion Failure (Bottleneck 3)&quot;)\n        print(&quot;  - Action: Users click to merchant but abandon checkout.&quot;)\n        print(&quot;  - Fix: Verify tracking parameters persist; check shipping fees; switch to 30+ day cookie program.&quot;)\n    else:\n        print(&quot;\u2714 FUNNEL IS HEALTHY. All conversion gates meet or exceed industry baselines.&quot;)\n        print(&quot;  - Growth Strategy: Scale cluster content and expand topical authority.&quot;)\n\n    print(&quot;\\n&quot; + &quot;=&quot;*65 + &quot;\\n&quot;)\n\nif __name__ == &quot;__main__&quot;:\n    # Test ClearTapLab diagnostic scenario: 2,500 impressions, 120 visits, 2 clicks, 0 sales\n    diagnose(impressions=2500, visits=120, outbound_clicks=2, sales=0, avg_payout=65.0)\n</code></pre>\n\n<hr />\n<h2 id=\"8-human-verification\">8. Human Verification</h2>\n<p>Before making changes based on a diagnostic report, verify these three operational checkpoints:</p>\n<ol>\n<li><strong>Test the Conversion Path Yourself:</strong> Click your own affiliate link in an incognito window. Walk through the merchant checkout process up to the payment screen. Is there a surprise \\$100 freight shipping charge? Is the product currently out of stock?</li>\n<li><strong>Review Mobile Usability on the Target Page:</strong> Load the specific underperforming guide on your phone. Are CTA buttons easy to find, or do you have to scroll through 10 screens of text to see an affiliate link?</li>\n<li><strong>Check Search Console Query Alignment:</strong> Inspect the queries driving traffic to the page. Are searchers looking for free DIY instructions, or are they looking for products to buy? If traffic is purely DIY, add a low-cost repair part or diagnostic test kit recommendation.</li>\n</ol>\n<hr />\n<h2 id=\"9-common-mistakes\">9. Common Mistakes</h2>\n<ul>\n<li><strong>Treating Symptoms Instead of Root Causes:</strong> Adding 10 more buy buttons to a page that has zero traffic. If impressions are zero, on-page buttons cannot fix the problem.</li>\n<li><strong>Abandoning a Niche Prematurely:</strong> Quitting because 50 clicks yielded 0 sales. A 2% conversion rate means you need roughly 50 to 100 clicks to record your first sale. Allow sufficient sample size before concluding a merchant does not convert.</li>\n<li><strong>Overreacting to Seasonal Dips:</strong> Panicking when traffic drops in late December for business-to-business or home utility tools. Always check Google Trends to account for natural seasonal patterns.</li>\n<li><strong>Ignoring Broken Affiliate Redirects:</strong> Failing to notice that an affiliate merchant changed networks, rendering your existing links dead. Run regular link checks.</li>\n</ul>\n<hr />\n<h2 id=\"10-checklist\">10. Checklist</h2>\n<ul>\n<li>[ ] I calculate Organic CTR, Affiliate CTR, and Merchant CR during my weekly reviews.</li>\n<li>[ ] Bottleneck 1 issues (No Traffic) are addressed with indexation audits and information gain updates.</li>\n<li>[ ] Bottleneck 2 issues (No Clicks) are addressed with above-the-fold verdicts and comparison tables.</li>\n<li>[ ] Bottleneck 3 issues (No Sales) are addressed by checking merchant landing page friction and cookie windows.</li>\n<li>[ ] <code>scripts/diagnose_funnel.py</code> is used to evaluate pipeline bottlenecks objectively.</li>\n</ul>\n<hr />\n<h2 id=\"11-practical-exercise\">11. Practical Exercise</h2>\n<ol>\n<li>Gather your real 30-day metrics (or use current project estimates).</li>\n<li>Run <code>python scripts/diagnose_funnel.py</code> in Antigravity with your numbers.</li>\n<li>Review the diagnostic triage output.</li>\n<li>Identify the single biggest bottleneck in your pipeline and implement the prescribed fix.</li>\n</ol>"}, {"id": "ch-32", "num": 32, "modTitle": "Module 8: The Part-Time Operating System: Launch, Diagnosis, & Scaling", "title": "Chapter 32: The Milestone Roadmap: From $50 to $100, Systemization, and Expansion", "html": "<h1 id=\"chapter-32-the-milestone-roadmap-from-50-to-100-systemization-and-expansion\">Chapter 32: The Milestone Roadmap: From $50 to $100, Systemization, and Expansion</h1>\n<hr />\n<h2 id=\"1-what-you-will-learn\">1. What You Will Learn</h2>\n<ul>\n<li>How to celebrate and analyze your first affiliate commission as proof of commercial viability.</li>\n<li>The exact steps to transition from early \\$50/month proof-of-concept to repeatable \\$100/month operations.</li>\n<li>How to negotiate commission rate increases (e.g., from 8% to 11%) with affiliate managers once you drive steady sales.</li>\n<li>The <strong>\"One-Site-First\" Rule</strong>: why starting a second website before reaching \\$500/month on your first site leads to burnout.</li>\n<li>How to expand your initial 20-page beachhead into adjacent topic clusters using Antigravity and automated runbooks.</li>\n</ul>\n<hr />\n<h2 id=\"2-why-this-matters\">2. Why This Matters</h2>\n<p>Earning your first \\$50 in affiliate marketing is a pivotal psychological and business milestone:</p>\n<p>$$\\mathbf{\\$0 \\longrightarrow \\$50} \\text{ is infinitely harder than } \\mathbf{\\$50 \\longrightarrow \\$500}$$</p>\n<p>Going from \\$0 to \\$50 requires:\n* Finding a validated niche,\n* Building a fast, secure website from scratch,\n* Earning the trust of search engine algorithms,\n* Publishing authoritative technical content,\n* Persuading a discerning stranger to trust your recommendation and make a purchase.</p>\n<p>Once you reach \\$50, the business model is <strong>proven</strong>. The math works. Your funnel converts.</p>\n<p>The common temptation at this stage is to immediately start a second website in a different niche. This is a mistake. Managing two websites while working part-time splits your limited hours, causing both sites to stall.</p>\n<p>The faster, more reliable path to growth is <strong>horizontal expansion of your existing authority site</strong>: adding adjacent topic clusters, negotiating higher commission tiers, and introducing new interactive utilities.</p>\n<hr />\n<h2 id=\"3-the-concept\">3. The Concept</h2>\n<h3 id=\"the-authority-scaling-pyramid\">The Authority Scaling Pyramid</h3>\n<pre class=\"codehilite\"><code>+\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500+\n| LEVEL 4: DIRECT BRAND PARTNERSHIPS ($500+/mo)                             |\n| - Custom reader discount codes; exclusive 12%\u201315% commission tiers.       |\n| - 50+ published guides; 3 interactive utilities; 20,000+ monthly visits. |\n+\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500+\n| LEVEL 3: ADJACENT CLUSTER EXPANSION ($100\u2013$300/mo)                        |\n| - Expand into 2 adjacent sub-verticals (e.g., Well Pumps &amp; UV Purifiers).  |\n| - Negotiate commission bumps with existing affiliate managers (+2%\u20133%).   |\n+\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500+\n| LEVEL 2: REPEATABILITY &amp; CRO TUNING ($50\u2013$100/mo)                         |\n| - Tune conversion funnels, refine low-CTR titles, resolve bottlenecks.    |\n| - Initial 20-page cornerstone cluster is fully indexed and ranking.       |\n+\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500+\n| LEVEL 1: PROOF OF CONCEPT ($0\u2013$50/mo)                                     |\n| - First qualified sales recorded; affiliate tracking verified.            |\n+\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500+\n</code></pre>\n\n<h3 id=\"the-commission-negotiation-protocol\">The Commission Negotiation Protocol</h3>\n<p>Affiliate networks list default commission rates (e.g., 8%). However, affiliate managers have discretion to grant <strong>private commission increases</strong> to publishers who drive consistent, high-quality traffic with low return rates.</p>\n<p>When your site generates 5 to 10 qualified sales per month:\n1. Contact your dedicated affiliate manager via email.\n2. Present your clean, high-E-E-A-T site design and technical analysis.\n3. Show your low return rate and qualified audience profile.\n4. Request a commission bump (e.g., from 8% to 10% or 11%).</p>\n<p>A commission bump from 8% to 11% represents an immediate <strong>37.5% increase in revenue</strong> with zero additional traffic.</p>\n<hr />\n<h2 id=\"4-step-by-step-process-scaling-to-100month-and-beyond\">4. Step-by-Step Process: Scaling to $100/Month and Beyond</h2>\n<pre class=\"codehilite\"><code>Step 1: Document Your First Qualified Sale (Log product, article ID, and user query).\nStep 2: Identify Your Top 3 Converting Guides in Search Console and Affiliate Dashboards.\nStep 3: Reach Out to Your Highest-Performing Affiliate Merchant for a Commission Review.\nStep 4: Plan 10 Expansion Guides Targeting an Adjacent Sub-Topic within Your Niche.\nStep 5: Build a Second Interactive Sizing Calculator to Deepen Site Engagement.\nStep 6: Maintain a Consistent 1-Hour Weekly Maintenance Schedule.\n</code></pre>\n\n<hr />\n<h2 id=\"5-real-example-cleartaplabs-expansion-blueprint\">5. Real Example: ClearTapLab's Expansion Blueprint</h2>\n<p>Here is how the <strong>ClearTapLab</strong> platform scaled beyond its initial \\$100/month milestone:</p>\n<h3 id=\"step-1-commission-negotiation\">Step 1: Commission Negotiation</h3>\n<p>After generating 6 sales of the SpringWell CF1 system in two months, ClearTapLab sent a performance review to the SpringWell affiliate manager on Impact. \n* <em>Result:</em> The merchant increased our commission rate from <strong>8.0% to 10.5%</strong>.\n* <em>Impact:</em> Our payout on a \\$1,164 system increased from <strong>\\$93.12 to \\$122.22 per sale</strong>.</p>\n<h3 id=\"step-2-adjacent-cluster-expansion\">Step 2: Adjacent Cluster Expansion</h3>\n<p>With the Reverse Osmosis cluster stabilized, ClearTapLab added 8 new guides targeting an adjacent sub-topic: <strong>Residential UV Water Disinfection</strong>:\n* Guide 21: <em>How UV Disinfection Works: 254nm Wavelength vs. Bacteria</em>\n* Guide 22: <em>Best Whole-House UV Purifiers (2026 Tested Audit)</em>\n* Guide 23: <em>UV Lamp Replacement: Quartz Sleeve Cleaning &amp; Sensor Calibration</em>\n* Guide 24: <em>Sizing UV Flow Rates: 12 GPM vs. 15 GPM Sizing Matrix</em></p>\n<h3 id=\"step-3-interactive-tool-addition\">Step 3: Interactive Tool Addition</h3>\n<p>ClearTapLab added a second interactive tool: the <strong>Well Water Contaminant Triage Selector</strong>, which allows users to select symptoms and receive an immediate equipment sizing recommendation.</p>\n<p><strong>The Financial Result:</strong> Within five months of launch, ClearTapLab reached <strong>\\$340 to \\$480 per month</strong> in stable, part-time affiliate commissions.</p>\n<hr />\n<h2 id=\"6-gemini-workflow-commission-negotiation-outreach-drafter\">6. Gemini Workflow: Commission Negotiation &amp; Outreach Drafter</h2>\n<p>Use Gemini to draft a professional commission increase request to your affiliate manager.</p>\n<pre class=\"codehilite\"><code>+-------------------------------------------------------------------------+\n| GEMINI PROMPT: COMMISSION BUMP NEGOTIATOR                               |\n+-------------------------------------------------------------------------+\n| Role: Senior Business Development Manager &amp; Affiliate Partner           |\n| Task: Draft an authoritative, professional email to an affiliate        |\n|       manager requesting a commission increase based on performance.    |\n+-------------------------------------------------------------------------+\n</code></pre>\n\n<h3 id=\"exact-prompt\">Exact Prompt</h3>\n<pre class=\"codehilite\"><code class=\"language-markdown\">You are a senior business development manager and digital publisher.\n\nDraft a professional, compelling commission increase request email to an affiliate manager:\n- My Website: [INSERT DOMAIN, e.g., ClearTapLab.com]\n- Niche Focus: [INSERT NICHE, e.g., Residential Water Chemistry &amp; Filtration]\n- Merchant Brand: [INSERT BRAND, e.g., SpringWell Water]\n- Current Performance: [INSERT STATS, e.g., 8 sales driven over the last 60 days with a 0% return rate]\n- Current Commission: [INSERT CURRENT %, e.g., 8%]\n- Target Commission: [INSERT TARGET %, e.g., 10% or 11%]\n\nRequirements:\n1. Professional Tone: Emphasize our engineering-grade content, transparent disclosures, and focus on high-intent buyers.\n2. Value Proposition: Highlight that our comprehensive guides explain their warranty, specifications, and certifications, resulting in informed customers and low return rates.\n3. Mutual Benefit: Propose giving their product featured placement in our upcoming topic cluster expansion in exchange for the commission adjustment.\n4. Keep the email concise (under 200 words) and easy to read.\n</code></pre>\n\n<h3 id=\"expected-output\">Expected Output</h3>\n<p>Gemini generates a polished, persuasive email that positions your site as a premium publishing partner rather than a generic coupon site.</p>\n<hr />\n<h2 id=\"7-antigravity-workflow-growth-expansion-scenario-modeling\">7. Antigravity Workflow: Growth &amp; Expansion Scenario Modeling</h2>\n<p>Instruct Antigravity to create <code>scripts/expansion_roadmap.py</code> to project the revenue impact of cluster expansions and commission bumps.</p>\n<h3 id=\"antigravity-steps\">Antigravity Steps</h3>\n<ol>\n<li>Open <strong>Antigravity IDE</strong>.</li>\n<li>Create <code>scripts/expansion_roadmap.py</code>.</li>\n<li>Run the script via the terminal to model your expansion path.</li>\n</ol>\n<h3 id=\"code-created-by-antigravity-scriptsexpansion_roadmappy\">Code Created by Antigravity (<code>scripts/expansion_roadmap.py</code>)</h3>\n<pre class=\"codehilite\"><code class=\"language-python\">#!/usr/bin/env python3\n&quot;&quot;&quot;\nscripts/expansion_roadmap.py - Authority Site Growth &amp; Revenue Projections\nClearTapLab Engineering Standard\n&quot;&quot;&quot;\n\ndef model_growth():\n    stages = [\n        {\n            &quot;stage&quot;: &quot;Phase 1: Initial Beachhead (Current)&quot;,\n            &quot;guides&quot;: 20,\n            &quot;monthly_visits&quot;: 3500,\n            &quot;affiliate_ctr&quot;: 0.032,\n            &quot;merchant_cr&quot;: 0.025,\n            &quot;aov&quot;: 650.0,\n            &quot;comm_pct&quot;: 0.08\n        },\n        {\n            &quot;stage&quot;: &quot;Phase 2: CRO &amp; Commission Bump (+2.5%)&quot;,\n            &quot;guides&quot;: 20,\n            &quot;monthly_visits&quot;: 3500,\n            &quot;affiliate_ctr&quot;: 0.045, # Optimized CTAs &amp; tables\n            &quot;merchant_cr&quot;: 0.028,\n            &quot;aov&quot;: 650.0,\n            &quot;comm_pct&quot;: 0.105 # Negotiated rate\n        },\n        {\n            &quot;stage&quot;: &quot;Phase 3: Adjacent Cluster Expansion (UV + Pumps)&quot;,\n            &quot;guides&quot;: 32,\n            &quot;monthly_visits&quot;: 7500,\n            &quot;affiliate_ctr&quot;: 0.045,\n            &quot;merchant_cr&quot;: 0.028,\n            &quot;aov&quot;: 650.0,\n            &quot;comm_pct&quot;: 0.105\n        },\n        {\n            &quot;stage&quot;: &quot;Phase 4: Full Authority Maturity&quot;,\n            &quot;guides&quot;: 45,\n            &quot;monthly_visits&quot;: 14000,\n            &quot;affiliate_ctr&quot;: 0.048,\n            &quot;merchant_cr&quot;: 0.030,\n            &quot;aov&quot;: 650.0,\n            &quot;comm_pct&quot;: 0.11\n        }\n    ]\n\n    print(&quot;\\n# Long-Term Authority Revenue Projections\\n&quot;)\n    print(&quot;| Phase | Published Guides | Monthly Visits | Est. Monthly Sales | Blended Payout | Projected Monthly Revenue |&quot;)\n    print(&quot;| :--- | :--- | :--- | :--- | :--- | :--- |&quot;)\n\n    for s in stages:\n        clicks = s[&quot;monthly_visits&quot;] * s[&quot;affiliate_ctr&quot;]\n        sales = clicks * s[&quot;merchant_cr&quot;]\n        payout = s[&quot;aov&quot;] * s[&quot;comm_pct&quot;]\n        revenue = sales * payout\n        print(f&quot;| {s['stage']} | {s['guides']} | {s['monthly_visits']:,} | {sales:.1f} sales | ${payout:.2f} | **${revenue:.2f} / mo** |&quot;)\n\n    print(&quot;\\n&quot; + &quot;=&quot;*65 + &quot;\\n&quot;)\n\nif __name__ == &quot;__main__&quot;:\n    model_growth()\n</code></pre>\n\n<hr />\n<h2 id=\"8-human-verification\">8. Human Verification</h2>\n<p>Before planning your expansion, verify these three operational checkpoints:</p>\n<ol>\n<li><strong>The Stability Check:</strong> Has your current website generated affiliate commissions for at least <strong>two consecutive months</strong>? Do not expand until initial revenue is consistent.</li>\n<li><strong>The Part-Time Workload Test:</strong> Calculate your weekly time commitment. Are you comfortably maintaining your site within 10 to 15 hours per week? If you feel overwhelmed, do not add more articles yet\u2014focus on systemizing your current routine.</li>\n<li><strong>The Topical Synergy Test:</strong> When planning an adjacent cluster, ensure it relates directly to your core audience. A water filtration site expanding into UV purification makes sense; expanding into kitchen knives confuses search engine authority.</li>\n</ol>\n<hr />\n<h2 id=\"9-common-mistakes\">9. Common Mistakes</h2>\n<ul>\n<li><strong>Starting a Second Website Too Early:</strong> Buying five domain names and starting three websites simultaneously. Each new site requires its own 90-day sandbox period, technical setup, and content development. <strong>Build one working, profitable asset first.</strong></li>\n<li><strong>Never Asking for Commission Increases:</strong> Accepting standard default commission rates for years. Affiliate managers regularly approve 1% to 3% rate bumps for active publishers who ask professionally.</li>\n<li><strong>Diluting Topical Relevance:</strong> Expanding into unrelated categories simply because they have high search volume. Keep every new cluster tightly connected to your core domain authority.</li>\n<li><strong>Neglecting Existing Content:</strong> Publishing new articles while leaving older guides outdated. Always spend 20% of your operating time reviewing and refreshing your top-performing guides with updated pricing and specifications.</li>\n</ul>\n<hr />\n<h2 id=\"10-checklist\">10. Checklist</h2>\n<ul>\n<li>[ ] I have celebrated my first affiliate commission as proof of commercial viability.</li>\n<li>[ ] I have committed to the \"One-Site-First\" rule until reaching at least \\$500/month.</li>\n<li>[ ] I have submitted a professional commission increase request after driving consistent sales.</li>\n<li>[ ] My expansion roadmap targets logically adjacent sub-topics within my validated micro-niche.</li>\n<li>[ ] My weekly maintenance schedule is protected at 60 minutes per week.</li>\n</ul>\n<hr />\n<h2 id=\"11-practical-exercise\">11. Practical Exercise</h2>\n<ol>\n<li>Run <code>python scripts/expansion_roadmap.py</code> in Antigravity to review your site's growth model.</li>\n<li>Identify one adjacent sub-topic (e.g., UV purifiers, water testing, well pumps) that directly complements your current content.</li>\n<li>Draft the titles for 4 new spoke guides in that adjacent cluster.</li>\n<li>Prepare your commission bump outreach email using the Gemini template and save it in <code>data/affiliate_outreach.md</code> for when you hit your first 5 sales.</li>\n</ol>"}];
    let currentIndex = 0;
    let currentFontSize = 17;

    const sidebar = document.getElementById("sidebar");
    const navList = document.getElementById("nav-list");
    const articleBody = document.getElementById("article-body");
    const chapterIndicator = document.getElementById("chapter-indicator");
    const readerPane = document.getElementById("reader-pane");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const searchInput = document.getElementById("search-input");
    const btnTheme = document.getElementById("btn-theme");

    function renderNav(filter = "") {
      navList.innerHTML = "";
      let lastMod = "";

      CHAPTERS.forEach((ch, idx) => {
        if (filter && !ch.title.toLowerCase().includes(filter.toLowerCase()) && !ch.html.toLowerCase().includes(filter.toLowerCase())) {
          return;
        }

        if (ch.modTitle !== lastMod) {
          lastMod = ch.modTitle;
          const modEl = document.createElement("li");
          modEl.className = "nav-module-title";
          modEl.textContent = ch.modTitle;
          navList.appendChild(modEl);
        }

        const li = document.createElement("li");
        li.className = `nav-item ${idx === currentIndex ? "active" : ""}`;
        li.innerHTML = `<span class="nav-item-num">${ch.num.toString().padStart(2, "0")}</span><span>${ch.title.replace(/^Chapter \d+:\s*/, "")}</span>`;
        li.onclick = () => loadChapter(idx);
        navList.appendChild(li);
      });
    }

    function loadChapter(index) {
      if (index < 0 || index >= CHAPTERS.length) return;
      currentIndex = index;
      const ch = CHAPTERS[currentIndex];
      
      articleBody.innerHTML = ch.html;
      chapterIndicator.textContent = `${ch.modTitle} · Chapter ${ch.num}`;
      readerPane.scrollTop = 0;

      // Update active sidebar state
      document.querySelectorAll(".nav-item").forEach((el, i) => {
        el.classList.toggle("active", i === currentIndex);
      });

      // Update prev/next buttons
      btnPrev.style.visibility = currentIndex > 0 ? "visible" : "hidden";
      btnNext.style.visibility = currentIndex < CHAPTERS.length - 1 ? "visible" : "hidden";

      if (currentIndex > 0) {
        btnPrev.textContent = `← Ch ${CHAPTERS[currentIndex - 1].num}`;
      }
      if (currentIndex < CHAPTERS.length - 1) {
        btnNext.textContent = `Ch ${CHAPTERS[currentIndex + 1].num} →`;
      }

      // Close mobile sidebar if open
      if (window.innerWidth < 900) {
        sidebar.classList.remove("open");
      }
    }

    btnPrev.onclick = () => loadChapter(currentIndex - 1);
    btnNext.onclick = () => loadChapter(currentIndex + 1);

    document.getElementById("toggle-sidebar").onclick = () => {
      sidebar.classList.toggle("open");
    };

    document.getElementById("btn-font-up").onclick = () => {
      if (currentFontSize < 24) {
        currentFontSize += 1;
        document.documentElement.style.setProperty("--font-size", `${currentFontSize}px`);
      }
    };

    document.getElementById("btn-font-down").onclick = () => {
      if (currentFontSize > 13) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty("--font-size", `${currentFontSize}px`);
      }
    };

    btnTheme.onclick = () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      btnTheme.textContent = isDark ? "☀️ Light" : "🌙 Dark";
      localStorage.setItem("reader-theme", isDark ? "dark" : "light");
    };

    searchInput.addEventListener("input", (e) => {
      renderNav(e.target.value);
    });

    // Restore saved theme
    if (localStorage.getItem("reader-theme") === "dark") {
      document.body.classList.add("dark");
      btnTheme.textContent = "☀️ Light";
    }

    // Initial load
    renderNav();
    loadChapter(0);
  </script>

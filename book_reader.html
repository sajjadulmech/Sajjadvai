nents\n\u251c\u2500\u2500 scripts/\n\u2502   \u251c\u2500\u2500 app.js                   # Client-side UI controller &amp; interactive calculator\n\u2502   \u2514\u2500\u2500 articles-data.js         # Master structured content repository\n\u251c\u2500\u2500 images/                      # Optimized local WebP illustrations and diagrams\n\u251c\u2500\u2500 tests/\n\u2502   \u2514\u2500\u2500 run_e2e_tests.py         # Automated Python quality &amp; link verification test runner\n\u2514\u2500\u2500 sitemap.xml                  # Search engine XML index\n</code></pre>\n\n<hr />\n<h2 id=\"2-production-agentsrulesagentsmd-template\">2. Production <code>.agents/rules/AGENTS.md</code> Template</h2>\n<p>Copy and paste this into <code>.agents/rules/AGENTS.md</code>:</p>\n<pre class=\"codehilite\"><code class=\"language-markdown\"># Autonomous Engineering &amp; Legal Compliance Standards\n\n## 1. Architectural Constraints\n- PURE STATIC STACK: Semantic HTML5, native CSS3 variables, and Vanilla JavaScript (ES6+).\n- ZERO EXTERNAL DEPENDENCIES: No npm build steps, no node_modules, no frontend frameworks (React, Vue), and no external CSS/JS CDNs. All assets must be stored locally.\n- PERFORMANCE MANDATE: Target 100/100 Core Web Vitals. Sub-second LCP, zero CLS, and sub-50ms INP on mobile devices.\n\n## 2. Affiliate Compliance &amp; Link Hygiene (FTC 16 CFR Part 255)\n- MANDATORY LINK TAGS: Every outbound affiliate hyperlink MUST include:\n  target=&quot;_blank&quot; rel=&quot;sponsored nofollow noopener&quot;\n- ABOVE-THE-FOLD DISCLOSURE: Every guide containing commercial recommendations must feature the standard `.ctl-disclosure` component before the first commercial link.\n- NO PRICING FABRICATION: Never hard-code static prices that violate merchant terms. Use &quot;Check Current Price&quot; or dynamic indicators.\n\n## 3. UI/UX &amp; Responsive Design Rules\n- CSS TOKENS: Colors, font scales, and spacing must use variables in `styles/main.css`.\n- MOBILE TOUCH ERGONOMICS: All clickable elements (buttons, nav tabs, slider thumbs) must have a minimum touch target of 44x44px.\n- TABLE WRAPPERS: All comparison tables must be contained in `.ctl-table-wrapper` with horizontal scroll (`overflow-x: auto`) to prevent mobile viewport clipping.\n\n## 4. Editorial Integrity (Strict Non-Fabrication)\n- Never claim personal unboxing, hands-on lab testing, or personal ownership.\n- Base all technical teardowns on verified third-party certified standards (NSF/ANSI, WQA, EPA) and manufacturer engineering schematics.\n\n## 5. Automated Verification Gate\n- Always run `python tests/run_e2e_tests.py` before marking any coding or content task complete.\n</code></pre>"}, {"id": "ch-22", "num": 22, "modTitle": "Appendices: The Technical Reference Desk", "title": "Appendix B: Master Python Automated Verification Suite", "html": "<h1 id=\"appendix-b-master-python-automated-verification-suite\">Appendix B: Master Python Automated Verification Suite</h1>\n<p>This test suite automatically audits your static site for broken internal links, missing FTC disclosures, non-compliant affiliate tags, and missing comparison table wrappers.</p>\n<p>Save this script at <code>tests/run_e2e_tests.py</code>:</p>\n<pre class=\"codehilite\"><code class=\"language-python\">#!/usr/bin/env python3\n&quot;&quot;&quot;\ntests/run_e2e_tests.py - Production QA &amp; Link Compliance Suite\nClearTapLab Engineering Standard\n&quot;&quot;&quot;\n\nimport os\nimport re\nimport sys\nfrom bs4 import BeautifulSoup\n\ndef run_suite():\n    print(&quot;=&quot; * 60)\n    print(&quot;RUNNING STATIC AFFILIATE ASSET VERIFICATION SUITE&quot;)\n    print(&quot;=&quot; * 60)\n\n    errors = []\n    tests_run = 0\n\n    # 1. Verify Core Files Exist\n    core_files = [\n        &quot;index.html&quot;,\n        &quot;_headers&quot;,\n        os.path.join(&quot;styles&quot;, &quot;main.css&quot;),\n        os.path.join(&quot;scripts&quot;, &quot;app.js&quot;),\n        os.path.join(&quot;scripts&quot;, &quot;articles-data.js&quot;)\n    ]\n    for cf in core_files:\n        tests_run += 1\n        if not os.path.exists(cf):\n            errors.append(f&quot;Missing critical core file: {cf}&quot;)\n\n    # 2. Inspect articles-data.js\n    articles_path = os.path.join(&quot;scripts&quot;, &quot;articles-data.js&quot;)\n    if os.path.exists(articles_path):\n        with open(articles_path, &quot;r&quot;, encoding=&quot;utf-8&quot;) as f:\n            content = f.read()\n\n        articles = re.findall(\n            r'id:\\s*[&quot;\\']([^&quot;\\']+)[&quot;\\'].*?contentHtml:\\s*`([^`]+)`',\n            content,\n            re.DOTALL\n        )\n\n        print(f&quot;Discovered {len(articles)} published guides in data store.&quot;)\n\n        for aid, html in articles:\n            soup = BeautifulSoup(html, &quot;html.parser&quot;)\n\n            # Check Disclosure\n            tests_run += 1\n            disclosure = soup.find(class_=re.compile(r&quot;disclosure&quot;, re.I))\n            if not disclosure:\n                errors.append(f&quot;Guide `{aid}`: Missing above-the-fold affiliate disclosure.&quot;)\n\n            # Check Outbound Affiliate Links\n            links = soup.find_all(&quot;a&quot;, href=True)\n            for a in links:\n                href = a[&quot;href&quot;]\n                if any(x in href for x in [&quot;amazon&quot;, &quot;shareasale&quot;, &quot;impact&quot;, &quot;springwell&quot;]):\n                    tests_run += 1\n                    rel = a.get(&quot;rel&quot;, [])\n                    rel_str = &quot; &quot;.join(rel) if isinstance(rel, list) else rel\n                    if &quot;sponsored&quot; not in rel_str or &quot;nofollow&quot; not in rel_str:\n                        errors.append(f&quot;Guide `{aid}`: Link `{href}` missing rel='sponsored nofollow'.&quot;)\n                    if a.get(&quot;target&quot;) != &quot;_blank&quot;:\n                        errors.append(f&quot;Guide `{aid}`: Link `{href}` missing target='_blank'.&quot;)\n\n            # Check Table Wrappers\n            tables = soup.find_all(&quot;table&quot;)\n            for t in tables:\n                tests_run += 1\n                parent = t.find_parent(class_=&quot;ctl-table-wrapper&quot;)\n                if not parent:\n                    errors.append(f&quot;Guide `{aid}`: Table not wrapped in `.ctl-table-wrapper`.&quot;)\n\n    print(f&quot;Total verification checks executed: {tests_run}&quot;)\n    print(&quot;=&quot; * 60)\n\n    if errors:\n        print(f&quot;FAILED: {len(errors)} compliance or structural issues detected:\\n&quot;)\n        for err in errors:\n            print(f&quot;  \u274c {err}&quot;)\n        sys.exit(1)\n    else:\n        print(&quot;PASS: All tests passed with 0 errors. Asset ready for production deploy.\\n&quot;)\n        sys.exit(0)\n\nif __name__ == &quot;__main__&quot;:\n    run_suite()\n</code></pre>"}, {"id": "ch-23", "num": 23, "modTitle": "Appendices: The Technical Reference Desk", "title": "Appendix C: FTC Legal Disclosures & Compliance Guide", "html": "<h1 id=\"appendix-c-ftc-legal-disclosures-compliance-guide\">Appendix C: FTC Legal Disclosures &amp; Compliance Guide</h1>\n<p>Under the Federal Trade Commission (FTC) Guides Concerning the Use of Endorsements and Testimonials in Advertising (16 CFR Part 255), commercial relationships between content creators and product merchants must be disclosed clearly and conspicuously.</p>\n<hr />\n<h2 id=\"1-the-3-core-legal-principles\">1. The 3 Core Legal Principles</h2>\n<ol>\n<li><strong>Clear and Conspicuous:</strong> Disclosures cannot be buried in fine print, hidden in low-contrast light gray text, or relegated solely to the site footer or a separate terms page.</li>\n<li><strong>Above the Fold:</strong> A reader must encounter the disclosure <strong>before</strong> they click any commercial recommendation or outbound affiliate link.</li>\n<li><strong>Plain English:</strong> Never use ambiguous jargon like \"aff/collab\" or \"sponsored partners.\" State plainly that purchases made through links may result in a financial commission at no extra cost to the buyer.</li>\n</ol>\n<hr />\n<h2 id=\"2-production-html-disclosure-component\">2. Production HTML Disclosure Component</h2>\n<p>Place this component at the very beginning of every article's <code>contentHtml</code>:</p>\n<pre class=\"codehilite\"><code class=\"language-html\">&lt;!-- Production FTC Above-the-Fold Disclosure --&gt;\n&lt;aside class=&quot;ctl-disclosure&quot; aria-label=&quot;Affiliate Disclosure&quot;&gt;\n  &lt;div class=&quot;ctl-disclosure-icon&quot;&gt;\u2139\ufe0f&lt;/div&gt;\n  &lt;div class=&quot;ctl-disclosure-text&quot;&gt;\n    &lt;strong&gt;Editorial Transparency:&lt;/strong&gt; ClearTapLab evaluates water treatment \n    systems through forensic engineering analysis of certified NSF/ANSI standards, \n    manufacturer installation manuals, and long-term failure logs. We do not accept \n    free review units. When you purchase equipment through our links, we may earn \n    an affiliate commission from our partners (such as SpringWell, Waterdrop, or Amazon) \n    at zero additional cost to you. This support funds our independent research.\n  &lt;/div&gt;\n&lt;/aside&gt;\n</code></pre>\n\n<hr />\n<h2 id=\"3-css-component-styling-stylesmaincss\">3. CSS Component Styling (<code>styles/main.css</code>)</h2>\n<pre class=\"codehilite\"><code class=\"language-css\">.ctl-disclosure {\n  display: flex;\n  align-items: flex-start;\n  gap: 0.875rem;\n  background-color: #f0f9ff;\n  border-left: 4px solid #0284c7;\n  border-radius: 0 6px 6px 0;\n  padding: 1rem 1.25rem;\n  margin: 1.5rem 0 2rem 0;\n  font-size: 0.875rem;\n  line-height: 1.5;\n  color: #334155;\n}\n\n.ctl-disclosure-icon {\n  font-size: 1.15rem;\n  flex-shrink: 0;\n  margin-top: 1px;\n}\n\n.ctl-disclosure-text strong {\n  color: #0f172a;\n}\n</code></pre>"}, {"id": "ch-24", "num": 24, "modTitle": "Appendices: The Technical Reference Desk", "title": "Appendix D: The Operator's Prompt Vault", "html": "<h1 id=\"appendix-d-the-operators-prompt-vault\">Appendix D: The Operator's Prompt Vault</h1>\n<p>A curated reference collection of the four primary strategic prompts used throughout the Gemini research and editorial pipeline.</p>\n<hr />\n<h2 id=\"1-the-niche-sceptic-prompt-niche-inversion\">1. The Niche Sceptic Prompt (Niche Inversion)</h2>\n<p><strong>When to use:</strong> When you have 2\u20133 niche candidates and need an objective critique before committing time.</p>\n<pre class=\"codehilite\"><code class=\"language-markdown\">You are a conservative business analyst evaluating physical product affiliate opportunities for a solo part-time operator (10 hours/week).\n\nI want to find 5 unglamorous, technical micro-niches based on ACUTE HOME OR WORKSHOP PROBLEMS, NOT lifestyle hobbies.\n\nFilter all candidates through these 5 mandatory constraints:\n1. Acute Pain: The user is searching to solve a specific, frustrating, or urgent failure (e.g., odor, leaks, mechanical wear, contamination, regulatory compliance), NOT casually browsing a hobby.\n2. High Payout Potential: The core solving equipment must retail between $200 and $1,200, with private affiliate programs paying 6% to 10% commission ($20 to $100 per sale).\n3. Consumable Tail: The equipment must require regular replacement consumables (filters, cartridges, calibration fluid, wear parts) that can be linked to Amazon or direct merchants for recurring sales.\n4. Independent Technical Standards: The products must be governed by published engineering standards (e.g., NSF, ANSI, UL, EPA, ISO) or manufacturer technical manuals, so we can evaluate specifications objectively without fabricating hands-on lab tests.\n5. Search Vulnerability: Search results must NOT be completely dominated by mainstream lifestyle media (Wirecutter, Forbes). There should be room for a specialized technical reference site.\n\nProvide 4 candidate micro-niches. For each candidate, specify the core problem, core product price, consumable parts, and why big lifestyle publishers ignore it.\n</code></pre>\n\n<hr />\n<h2 id=\"2-the-information-gap-extractor-competitor-research\">2. The Information Gap Extractor (Competitor Research)</h2>\n<p><strong>When to use:</strong> Before drafting any cornerstone guide. Paste summaries of the top 3 ranking Google results to extract their technical omissions.</p>\n<pre class=\"codehilite\"><code class=\"language-markdown\">You are a senior investigative technical editor specializing in consumer mechanical appliances.\n\nHere are the text summaries of the 3 top-ranking articles for the search query: [INSERT QUERY]:\n&quot;&quot;&quot;\n[PASTE COMPETITOR OUTLINES OR EXCERPTS HERE]\n&quot;&quot;&quot;\n\nPerform an Information Gain &amp; Gap Audit:\n1. Identify 4 critical technical questions that an educated homeowner would have before spending $800, but which NONE of these 3 competitor articles answered.\n2. Search manufacturer technical manuals, NSF/ANSI Standard 58 performance listings, and plumbing installation guides to find the exact answers to those 4 missing questions.\n3. Highlight any physical limitations, plumbing fitting constraints, water temperature limits, or recurring consumable costs that competitors ignored.\n4. Output these findings as a structured &quot;Information Gain Brief&quot; that will form the core of our technical teardown.\n</code></pre>\n\n<hr />\n<h2 id=\"3-the-forensic-teardown-drafter\">3. The Forensic Teardown Drafter</h2>\n<p><strong>When to use:</strong> To draft a product teardown using engineering manuals and certified test data without fake hands-on claims.</p>\n<pre class=\"codehilite\"><code class=\"language-markdown\">You are a senior plumbing systems and materials engineer writing a forensic technical product teardown for ClearTapLab.com.\n\nProduct to Analyze: [INSERT PRODUCT, e.g., Waterdrop G3P800 Tankless Reverse Osmosis System]\nRetail Price: [INSERT PRICE, e.g., $799]\nTarget Audience: Discerning homeowners researching under-sink water purification.\n\nStrict Editorial Directives:\n1. ABSOLUTE NON-FABRICATION: Never use first-person pronouns claiming personal unboxing, hands-on testing, or kitchen installation. Write from the perspective of an independent technical analyst evaluating public engineering documentation.\n2. CITATION OF CERTIFIED STANDARDS: Cite official NSF/ANSI Standards (42, 53, 58, 372). Specify exact percentage reduction for lead, PFOA/PFAS, and TDS.\n3. PHYSICAL &amp; PLUMBING REALITIES: Detail cabinet clearance requirements, unswitched 110V electrical requirements, feed water pressure limits, and booster pump noise dynamics (dB).\n4. THE &quot;SO WHAT?&quot; TEST: For every dry technical specification, explain its direct household consequence.\n5. 5-YEAR TCO AUDIT: Include a detailed replacement schedule table breaking down composite filter and RO membrane costs over 60 months.\n</code></pre>\n\n<hr />\n<h2 id=\"4-the-commission-negotiation-pitch\">4. The Commission Negotiation Pitch</h2>\n<p><strong>When to use:</strong> When your site generates 5+ sales per month with a merchant and you want to request a private commission tier increase.</p>\n<pre class=\"codehilite\"><code class=\"language-text\">Subject: [YourDomain.com] Performance Review &amp; Commission Tier Discussion\n\nHi [Affiliate Manager Name],\n\nMy name is [Your Name], publisher of [YourDomain.com]. Over the last 60 days, our technical guides have driven [Number, e.g., 8] qualified sales of your [Brand/System Name], with an exceptional 0% customer return rate.\n\nOur platform focuses heavily on technical pre-purchase installation education (electrical requirements, plumbing clearance, certified NSF standards), which ensures our referred buyers are fully qualified and know exactly what they are purchasing.\n\nWe are currently planning an expansion into our next topic cluster ([e.g., Residential UV Disinfection &amp; Whole House Systems]), where we intend to feature [Merchant Brand] as our primary recommendation.\n\nGiven our conversion performance and upcoming cluster expansion, would you be open to adjusting our baseline commission tier from 8.0% to 10.5%?\n\nYou can review our live platform and recent teardown of your equipment here:\n[Link to your best-performing guide]\n\nThank you for your partnership,\n[Your Name]\n[YourDomain.com]\n</code></pre>"}];
    let currentIndex = 0;
    let currentFontSize = 17;

    const sidebar = document.getElementById("sidebar");
    const navList = document.getElementById("nav-list");
    const articleBody = document.getElementById("article-body");
    const chapterIndicator = document.getElementById("chapter-indicator");
    const readerPane = document.getElementById("reader-pane");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");
    const searchInput = document.getElementById("search-input");
    const btnTheme = document.getElementById("btn-theme");

    function renderNav(filter = "") {
      navList.innerHTML = "";
      let lastMod = "";

      CHAPTERS.forEach((ch, idx) => {
        if (filter && !ch.title.toLowerCase().includes(filter.toLowerCase()) && !ch.html.toLowerCase().includes(filter.toLowerCase())) {
          return;
        }

        if (ch.modTitle !== lastMod) {
          lastMod = ch.modTitle;
          const modEl = document.createElement("li");
          modEl.className = "nav-module-title";
          modEl.textContent = ch.modTitle;
          navList.appendChild(modEl);
        }

        const li = document.createElement("li");
        li.className = `nav-item ${idx === currentIndex ? "active" : ""}`;
        li.innerHTML = `<span class="nav-item-num">${ch.num.toString().padStart(2, "0")}</span><span>${ch.title.replace(/^Chapter \d+:\s*/, "")}</span>`;
        li.onclick = () => loadChapter(idx);
        navList.appendChild(li);
      });
    }

    function loadChapter(index) {
      if (index < 0 || index >= CHAPTERS.length) return;
      currentIndex = index;
      const ch = CHAPTERS[currentIndex];
      
      articleBody.innerHTML = ch.html;
      chapterIndicator.textContent = `${ch.modTitle} · Chapter ${ch.num}`;
      readerPane.scrollTop = 0;

      // Update active sidebar state
      document.querySelectorAll(".nav-item").forEach((el, i) => {
        el.classList.toggle("active", i === currentIndex);
      });

      // Update prev/next buttons
      btnPrev.style.visibility = currentIndex > 0 ? "visible" : "hidden";
      btnNext.style.visibility = currentIndex < CHAPTERS.length - 1 ? "visible" : "hidden";

      if (currentIndex > 0) {
        btnPrev.textContent = `← Ch ${CHAPTERS[currentIndex - 1].num}`;
      }
      if (currentIndex < CHAPTERS.length - 1) {
        btnNext.textContent = `Ch ${CHAPTERS[currentIndex + 1].num} →`;
      }

      // Close mobile sidebar if open
      if (window.innerWidth < 900) {
        sidebar.classList.remove("open");
      }
    }

    btnPrev.onclick = () => loadChapter(currentIndex - 1);
    btnNext.onclick = () => loadChapter(currentIndex + 1);

    document.getElementById("toggle-sidebar").onclick = () => {
      sidebar.classList.toggle("open");
    };

    document.getElementById("btn-font-up").onclick = () => {
      if (currentFontSize < 24) {
        currentFontSize += 1;
        document.documentElement.style.setProperty("--font-size", `${currentFontSize}px`);
      }
    };

    document.getElementById("btn-font-down").onclick = () => {
      if (currentFontSize > 13) {
        currentFontSize -= 1;
        document.documentElement.style.setProperty("--font-size", `${currentFontSize}px`);
      }
    };

    btnTheme.onclick = () => {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      btnTheme.textContent = isDark ? "☀️ Light" : "🌙 Dark";
      localStorage.setItem("reader-theme", isDark ? "dark" : "light");
    };

    searchInput.addEventListener("input", (e) => {
      renderNav(e.target.value);
    });

    // Restore saved theme
    if (localStorage.getItem("reader-theme") === "dark") {
      document.body.classList.add("dark");
      btnTheme.textContent = "☀️ Light";
    }

    // Initial load
    renderNav();
    loadChapter(0);
  </script>
</body>
</html>
